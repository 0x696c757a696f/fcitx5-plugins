version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Must match the fcitx5 commit that fcitx5-windows-next ships, so it moves with that repository.
      - dependency-name: fcitx5
    groups:
      submodules:
        patterns:
          - '*'
