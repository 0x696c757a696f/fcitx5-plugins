name: Windows build

on:
  workflow_call:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both build natively, because libime and table data are generated by tools built in the tree.
          - { arch: x86_64, runner: windows-2025, cmake_arch: AMD64, msystem: CLANG64, pkg_arch: x86_64 }
          - { arch: arm64, runner: windows-11-arm, cmake_arch: ARM64, msystem: CLANGARM64, pkg_arch: aarch64 }

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            mingw-w64-clang-${{ matrix.pkg_arch }}-boost
            mingw-w64-clang-${{ matrix.pkg_arch }}-clang
            mingw-w64-clang-${{ matrix.pkg_arch }}-cmake
            mingw-w64-clang-${{ matrix.pkg_arch }}-dlfcn
            mingw-w64-clang-${{ matrix.pkg_arch }}-extra-cmake-modules
            mingw-w64-clang-${{ matrix.pkg_arch }}-fmt
            mingw-w64-clang-${{ matrix.pkg_arch }}-gettext-runtime
            mingw-w64-clang-${{ matrix.pkg_arch }}-gettext-tools
            mingw-w64-clang-${{ matrix.pkg_arch }}-libiconv
            mingw-w64-clang-${{ matrix.pkg_arch }}-libthai
            mingw-w64-clang-${{ matrix.pkg_arch }}-librime
            mingw-w64-clang-${{ matrix.pkg_arch }}-libuv
            mingw-w64-clang-${{ matrix.pkg_arch }}-lua
            mingw-w64-clang-${{ matrix.pkg_arch }}-marisa
            mingw-w64-clang-${{ matrix.pkg_arch }}-ninja
            mingw-w64-clang-${{ matrix.pkg_arch }}-nlohmann-json
            mingw-w64-clang-${{ matrix.pkg_arch }}-opencc
            mingw-w64-clang-${{ matrix.pkg_arch }}-pkgconf
            mingw-w64-clang-${{ matrix.pkg_arch }}-zstd

      - name: Set up environment
        shell: bash
        run: |
          root=$(cygpath -m '${{ steps.msys2.outputs.msys2-location }}')
          echo "MSYS2_ROOT=$root" >> "$GITHUB_ENV"
          echo "$root/${{ matrix.msystem }}/bin" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_PATH"
          pip install dirhash pefile

      - name: Build Fcitx5
        shell: bash
        env:
          CC: clang
          CXX: clang++
          MSYS_NO_PATHCONV: 1
        run: |
          # Plugins link against the same fcitx5 commit that fcitx5-windows-next ships.
          cmake -S fcitx5 -B build/fcitx5-${{ matrix.arch }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_CXX_FLAGS=-fexperimental-library \
            -DENABLE_DBUS=OFF -DENABLE_X11=OFF -DENABLE_WAYLAND=OFF -DENABLE_KEYBOARD=OFF \
            -DENABLE_SERVER=OFF -DENABLE_TEST=OFF -DENABLE_TESTING_ADDONS=OFF -DBUILD_SPELL_DICT=OFF \
            -DENABLE_DOC=OFF -DENABLE_LIBUUID=OFF -DENABLE_ENCHANT=OFF -DENABLE_EMOJI=OFF \
            -DENABLE_XDGAUTOSTART=OFF
          cmake --build build/fcitx5-${{ matrix.arch }}
          DESTDIR=$(cygpath -m "$PWD")/build/windows-${{ matrix.arch }} cmake --install build/fcitx5-${{ matrix.arch }}

      - name: Build
        shell: bash
        run: |
          git apply --directory=libime patches/libime.patch
          git apply --directory=libime patches/libime.windows.patch
          git apply --directory=fcitx5-lua patches/lua.patch
          git apply --directory=fcitx5-chinese-addons patches/chinese-addons.patch
          git apply --directory=fcitx5-chinese-addons patches/chinese-addons.windows.patch
          git apply --directory=fcitx5-jyutping patches/jyutping.patch
          git apply --directory=fcitx5-rime patches/rime.log.patch
          git apply --directory=fcitx5-rime patches/rime.windows.patch
          git apply --directory=fcitx5-table-other patches/table-other.patch
          cmake -B build/windows-${{ matrix.arch }} -G Ninja \
            $(./scripts/windows-options.sh) \
            -DCMAKE_BUILD_TYPE=Release \
            -DARCH=${{ matrix.cmake_arch }}
          # Tools built in the tree generate data and need the Fcitx5 DLLs.
          export PATH="$PWD/build/windows-${{ matrix.arch }}/usr/bin:$PATH"
          # Keep going so one run reports every compile error.
          cmake --build build/windows-${{ matrix.arch }} -- -k 0
          ./scripts/install.sh windows ${{ matrix.arch }}

      - name: Upload arch-specific artifact
        uses: actions/upload-artifact@v7
        with:
          name: artifact-windows-${{ matrix.arch }}
          path: |
            build/windows-${{ matrix.arch }}/*-${{ matrix.arch }}.tar.bz2

      - name: Upload arch-unspecific artifact
        if: ${{ matrix.arch == 'x86_64' }}
        uses: actions/upload-artifact@v7
        with:
          name: artifact-windows
          path: |
            build/windows-${{ matrix.arch }}/*-any.tar.bz2
