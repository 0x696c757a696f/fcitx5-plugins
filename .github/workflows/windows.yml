name: Windows build

on:
  workflow_call:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both build natively, because libime and table data are generated by tools built in the tree.
          - { arch: x86_64, runner: windows-2025, cmake_arch: AMD64, msystem: CLANG64, pkg_arch: x86_64 }
          - { arch: arm64, runner: windows-11-arm, cmake_arch: ARM64, msystem: CLANGARM64, pkg_arch: aarch64 }

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            bison
            mingw-w64-clang-${{ matrix.pkg_arch }}-boost
            mingw-w64-clang-${{ matrix.pkg_arch }}-cbindgen
            mingw-w64-clang-${{ matrix.pkg_arch }}-ccache
            mingw-w64-clang-${{ matrix.pkg_arch }}-clang
            mingw-w64-clang-${{ matrix.pkg_arch }}-corrosion
            mingw-w64-clang-${{ matrix.pkg_arch }}-cmake
            mingw-w64-clang-${{ matrix.pkg_arch }}-dlfcn
            mingw-w64-clang-${{ matrix.pkg_arch }}-extra-cmake-modules
            mingw-w64-clang-${{ matrix.pkg_arch }}-fmt
            mingw-w64-clang-${{ matrix.pkg_arch }}-gettext-runtime
            mingw-w64-clang-${{ matrix.pkg_arch }}-gettext-tools
            mingw-w64-clang-${{ matrix.pkg_arch }}-go
            mingw-w64-clang-${{ matrix.pkg_arch }}-glib2
            mingw-w64-clang-${{ matrix.pkg_arch }}-json-glib
            mingw-w64-clang-${{ matrix.pkg_arch }}-libgee
            mingw-w64-clang-${{ matrix.pkg_arch }}-libiconv
            mingw-w64-clang-${{ matrix.pkg_arch }}-libthai
            mingw-w64-clang-${{ matrix.pkg_arch }}-librime
            mingw-w64-clang-${{ matrix.pkg_arch }}-libuv
            mingw-w64-clang-${{ matrix.pkg_arch }}-lua
            mingw-w64-clang-${{ matrix.pkg_arch }}-marisa
            mingw-w64-clang-${{ matrix.pkg_arch }}-ninja
            mingw-w64-clang-${{ matrix.pkg_arch }}-nlohmann-json
            mingw-w64-clang-${{ matrix.pkg_arch }}-opencc
            mingw-w64-clang-${{ matrix.pkg_arch }}-pkgconf
            mingw-w64-clang-${{ matrix.pkg_arch }}-rust
            mingw-w64-clang-${{ matrix.pkg_arch }}-vala
            mingw-w64-clang-${{ matrix.pkg_arch }}-zstd

      - name: Set up environment
        id: env
        shell: bash
        run: |
          root=$(cygpath -m '${{ steps.msys2.outputs.msys2-location }}')
          echo "MSYS2_ROOT=$root" >> "$GITHUB_ENV"
          echo "$root/${{ matrix.msystem }}/bin" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_PATH"
          # GLib pulls in MSYS2's Python; keep the one with pefile and meson first.
          cygpath -m "$pythonLocation" >> "$GITHUB_PATH"
          cygpath -m "$pythonLocation/Scripts" >> "$GITHUB_PATH"
          # MSYS2 ships a trimmed go binary that needs GOROOT spelled out.
          echo "GOROOT=$root/$(echo '${{ matrix.msystem }}' | tr '[:upper:]' '[:lower:]')/lib/go" >> "$GITHUB_ENV"
          pip install dirhash meson pefile
          echo "CCACHE_DIR=$(cygpath -m "$PWD")/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$(cygpath -m "$PWD")" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=2G" >> "$GITHUB_ENV"
          echo "fcitx5=$(git rev-parse HEAD:fcitx5)" >> "$GITHUB_OUTPUT"

      # Fcitx5 only changes when its pin does, so reuse the installed tree.
      - uses: actions/cache@v6
        id: fcitx5-cache
        with:
          path: build/fcitx5-install-${{ matrix.arch }}
          key: fcitx5-windows-${{ matrix.arch }}-${{ steps.env.outputs.fcitx5 }}-${{ hashFiles('.github/workflows/windows.yml') }}

      - uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-windows-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: ccache-windows-${{ matrix.arch }}-

      - name: Build Fcitx5
        if: steps.fcitx5-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          CC: clang
          CXX: clang++
          MSYS_NO_PATHCONV: 1
        run: |
          # Plugins link against the same fcitx5 commit that fcitx5-windows-next ships.
          cmake -S fcitx5 -B build/fcitx5-${{ matrix.arch }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_CXX_FLAGS=-fexperimental-library \
            -DENABLE_DBUS=OFF -DENABLE_X11=OFF -DENABLE_WAYLAND=OFF -DENABLE_KEYBOARD=OFF \
            -DENABLE_SERVER=OFF -DENABLE_TEST=OFF -DENABLE_TESTING_ADDONS=OFF -DBUILD_SPELL_DICT=OFF \
            -DENABLE_DOC=OFF -DENABLE_LIBUUID=OFF -DENABLE_ENCHANT=OFF -DENABLE_EMOJI=OFF \
            -DENABLE_XDGAUTOSTART=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build/fcitx5-${{ matrix.arch }}
          DESTDIR=$(cygpath -m "$PWD")/build/fcitx5-install-${{ matrix.arch }} cmake --install build/fcitx5-${{ matrix.arch }}

      - name: Install Fcitx5
        shell: bash
        run: |
          mkdir -p build/windows-${{ matrix.arch }}
          # Dereference the icon symlinks, which Windows cannot recreate here.
          cp -rL build/fcitx5-install-${{ matrix.arch }}/. build/windows-${{ matrix.arch }}/

      - name: Cache dependencies
        id: deps-key
        shell: bash
        run: |
          key=$( (git submodule status --recursive deps; git ls-files -s scripts/build-windows-deps.sh patches/windows) | sha256sum | cut -c1-16)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: cache/windows
          key: deps-windows-${{ matrix.arch }}-${{ steps.deps-key.outputs.key }}

      - name: Build dependencies
        shell: bash
        env:
          CC: clang
          CXX: clang++
          MSYS_NO_PATHCONV: 1
        run: bash -x ./scripts/build-windows-deps.sh ${{ matrix.arch }}

      - name: Build
        shell: bash
        env:
          # cgo builds bamboo-core with the MSYS2 compilers.
          CC: clang
          CXX: clang++
        run: |
          git apply --directory=fcitx5-anthy patches/anthy.windows.patch
          git apply --directory=libime patches/libime.patch
          git apply --directory=libime patches/libime.windows.patch
          git apply --directory=fcitx5-lua patches/lua.patch
          git apply --directory=fcitx5-chinese-addons patches/chinese-addons.patch
          git apply --directory=fcitx5-chinese-addons patches/chinese-addons.windows.patch
          git apply --directory=fcitx5-cskk patches/cskk.windows.patch
          git apply --directory=fcitx5-jyutping patches/jyutping.patch
          git apply --directory=fcitx5-keyman patches/keyman.windows.patch
          git apply --directory=fcitx5-kkc patches/kkc.windows.patch
          git apply --directory=fcitx5-m17n patches/m17n.windows.patch
          git apply --directory=fcitx5-rime patches/rime.log.patch
          git apply --directory=fcitx5-rime patches/rime.windows.patch
          git apply --directory=fcitx5-skk patches/skk.windows.patch
          git apply --directory=fcitx5-table-other patches/table-other.patch
          git apply --directory=fcitx5-zhuyin patches/zhuyin.windows.patch
          cmake -B build/windows-${{ matrix.arch }} -G Ninja \
            $(./scripts/windows-options.sh) \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DARCH=${{ matrix.cmake_arch }}
          # Tools built in the tree generate data and need the Fcitx5 DLLs.
          # Keep going so one run reports every compile error.
          PATH="$PWD/build/windows-${{ matrix.arch }}/usr/bin:$PATH" \
            cmake --build build/windows-${{ matrix.arch }} -- -k 0
          bash -x ./scripts/install.sh windows ${{ matrix.arch }}

      # Saved even when the build fails, so the next attempt only recompiles what changed.
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: .ccache
          key: ccache-windows-${{ matrix.arch }}-${{ github.run_id }}

      - name: Upload arch-specific artifact
        uses: actions/upload-artifact@v7
        with:
          name: artifact-windows-${{ matrix.arch }}
          path: |
            build/windows-${{ matrix.arch }}/*-${{ matrix.arch }}.tar.bz2

      - name: Upload arch-unspecific artifact
        if: ${{ matrix.arch == 'x86_64' }}
        uses: actions/upload-artifact@v7
        with:
          name: artifact-windows
          path: |
            build/windows-${{ matrix.arch }}/*-any.tar.bz2
