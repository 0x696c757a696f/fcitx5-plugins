name: Sync upstream

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Apply upstream changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch https://github.com/fcitx-contrib/fcitx5-plugins master
          old=$(cat .upstream-commit)
          new=$(git rev-parse FETCH_HEAD)
          if [[ "$old" == "$new" ]]; then
            echo "Already at upstream $new."
            exit 0
          fi
          # Workflows are Windows-only here and maintained in this fork, so upstream's are skipped.
          # Submodules are updated by Dependabot here, so upstream's pins are skipped too.
          excludes=(':!.github' ':!renovate.json')
          for path in $(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | cut -d' ' -f2); do
            excludes+=(":!$path")
          done
          git diff --binary "$old" "$new" -- . "${excludes[@]}" > upstream.patch
          if [[ -s upstream.patch ]] && ! git apply --index -3 upstream.patch; then
            body="Applying fcitx-contrib/fcitx5-plugins $old..$new conflicts with this fork. Resolve it by hand and update .upstream-commit."
            if [[ -z "$(gh issue list --state open --search 'Upstream sync conflict in:title' --json number -q '.[].number')" ]]; then
              gh issue create --title 'Upstream sync conflict' --body "$body"
            fi
            exit 1
          fi
          rm upstream.patch
          echo "$new" > .upstream-commit
          git add .upstream-commit
          git commit -m "Sync upstream fcitx-contrib/fcitx5-plugins@${new:0:7}" \
            -m "Upstream range: $old..$new"

      - name: Follow the fcitx5 and MSYS2 pins of fcitx5-windows-next
        run: |
          curl -fsSL -o bootstrap-fcitx.ps1 \
            https://raw.githubusercontent.com/0x696c757a696f/fcitx5-windows-next/main/tools/bootstrap-fcitx.ps1
          pin=$(sed -n "s/.*Name = 'fcitx5';.*Commit = '\([0-9a-f]\{40\}\)'.*/\1/p" bootstrap-fcitx.ps1)
          sed -n "s/^ *'\(mingw-w64-clang-x86_64-[^=']*=[^']*\)',\{0,1\}$/\1/p" bootstrap-fcitx.ps1 > runtime-pins.txt
          rm bootstrap-fcitx.ps1
          if [[ -z "$pin" || ! -s runtime-pins.txt ]]; then
            echo "::error::Could not read the pins from fcitx5-windows-next."
            exit 1
          fi
          if [[ "$pin" != "$(git rev-parse HEAD:fcitx5)" ]]; then
            git update-index --cacheinfo "160000,$pin,fcitx5"
            git commit -m "Update fcitx5 to ${pin:0:7}" -m "Follows fcitx5-windows-next tools/bootstrap-fcitx.ps1."
          fi
          mv runtime-pins.txt windows-runtime-pins.txt
          if ! git diff --quiet -- windows-runtime-pins.txt; then
            git add windows-runtime-pins.txt
            git commit -m "Update the MSYS2 pins to match fcitx5-windows-next" \
              -m "Follows fcitx5-windows-next tools/bootstrap-fcitx.ps1."
          fi

      - name: Push and test
        run: |
          if [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/master)" ]]; then
            echo "Nothing to sync."
            exit 0
          fi
          git push --force origin HEAD:refs/heads/upstream-sync
          gh workflow run ci.yml --ref upstream-sync
