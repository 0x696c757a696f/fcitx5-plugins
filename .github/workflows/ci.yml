name: ci

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install ruff pyright dirhash pefile

      - name: Lint
        run: |
          ruff check scripts
          pyright scripts/*.py

  windows:
    needs: lint
    uses: ./.github/workflows/windows.yml

  promote:
    needs: windows
    if: ${{ github.ref == 'refs/heads/upstream-sync' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Fast-forward master to the tested upstream sync
        run: gh api "repos/$GH_REPO/git/refs/heads/master" -X PATCH -f sha="$GITHUB_SHA" -F force=false

  release:
    needs: [windows, promote]
    if: >-
      ${{ !cancelled() && needs.windows.result == 'success' &&
      ((github.ref == 'refs/heads/master' && github.event_name != 'pull_request') || needs.promote.result == 'success') }}
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write

  dependabot:
    needs: windows
    if: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Merge Dependabot pull request
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch \
            --match-head-commit ${{ github.event.pull_request.head.sha }}
          gh workflow run ci.yml --ref master
